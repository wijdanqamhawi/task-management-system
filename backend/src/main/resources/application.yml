# T008 — all configuration from environment variables; no credential is committed (Constitution II).
spring:
  application:
    name: task-management
  datasource:
    url: ${TMS_DB_URL}
    username: ${TMS_DB_USER}
    password: ${TMS_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      pool-name: tms-pool
  # No JPA / Hibernate configuration exists here by design (R-001).
  # Data access is JdbcTemplate against the hand-written schema in database/ddl/.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # secure: true is set by the docker/production profile (R-002)

tms:
  attachments:
    directory: ${TMS_ATTACHMENT_DIR}
    max-size-bytes: 10485760
    allowed-content-types: >-
      application/pdf,
      image/png,image/jpeg,
      text/plain,text/csv,
      application/msword,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      application/vnd.ms-excel,
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  notifications:
    # FR-056 — "approaching deadline" = 24 hours before due date (CLARIFIED decision).
    deadline-warning-hours: 24
    # Hourly scheduled generation; idempotence comes from the unique constraint (R-007).
    schedule-cron: "0 0 * * * *"

logging:
  level:
    root: INFO
    com.computercenter.taskmanagement: DEBUG
